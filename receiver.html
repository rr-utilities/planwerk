<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="pult. Receiver" />
  <meta name="theme-color" content="#FBFBF9" />
  <title>pult. · Receiver</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          },
          colors: {
            paper: '#FBFBF9',
            surface: '#FFFFFF',
            ink: '#18181B',
            muted: '#71717A',
            subtle: '#A1A1AA',
            line: '#E4E4E7',
          }
        }
      }
    };
  </script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #FBFBF9;
      color: #18181B;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .pult-check {
      appearance: none;
      -webkit-appearance: none;
      width: 1.05rem;
      height: 1.05rem;
      min-width: 1.05rem;
      margin-top: 0.15rem;
      border: 1.5px solid #A1A1AA;
      border-radius: 5px;
      background-color: #FFFFFF;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .pult-check:checked {
      background-color: #18181B;
      border-color: #18181B;
    }
    .pult-check:checked::after {
      content: "";
      width: 0.32rem;
      height: 0.55rem;
      border: solid #FFFFFF;
      border-width: 0 1.75px 1.75px 0;
      transform: rotate(45deg);
      margin-bottom: 1px;
    }
  </style>
</head>
<body class="min-h-screen bg-paper text-ink">
  <!-- Schlichter Receiver-Kopf ohne Pairing/Connect -->
  <header class="sticky top-0 z-20 bg-paper/90 backdrop-blur-md border-b border-line">
    <div class="max-w-xl mx-auto px-4 py-3.5 flex items-center justify-between gap-3">
      <div>
        <div class="flex items-center gap-2">
          <span class="font-semibold tracking-tight text-lg text-ink">pult.</span>
          <span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-zinc-200/70 text-muted">Receiver</span>
        </div>
        <p class="text-[11px] text-muted mt-0.5">Ein Schreibtisch für alles, was empfangen wird</p>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button id="btn-restart-receiver" type="button" title="Aktualisieren" aria-label="Aktualisieren" class="p-1.5 rounded-lg bg-zinc-100 hover:bg-zinc-200 text-muted hover:text-ink transition-colors">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
            <polyline points="21 3 21 9 15 9"/>
          </svg>
        </button>
        <button id="btn-enable-notify" type="button" class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-zinc-100 hover:bg-zinc-200 text-ink transition-colors">
          Mitteilungen
        </button>
      </div>
    </div>

    <!-- Klare Unterscheidung nach Typ innerhalb des einen Receiver-Schreibtischs -->
    <div class="max-w-xl mx-auto px-4 pb-2.5 flex items-center gap-1.5 overflow-x-auto">
      <button type="button" data-filter="all" class="filter-pill px-3 py-1 rounded-full text-xs font-medium bg-ink text-white">Alles</button>
      <button type="button" data-filter="reminder" class="filter-pill px-3 py-1 rounded-full text-xs font-medium bg-surface border border-line text-muted hover:text-ink">Erinnerungen</button>
      <button type="button" data-filter="event" class="filter-pill px-3 py-1 rounded-full text-xs font-medium bg-surface border border-line text-muted hover:text-ink">Ereignisse</button>
      <button type="button" data-filter="note" class="filter-pill px-3 py-1 rounded-full text-xs font-medium bg-surface border border-line text-muted hover:text-ink">Notizen</button>
    </div>
  </header>

  <!-- Reine chronologische Datumsliste + Einmal-Link/Code-Import -->
  <main class="max-w-xl mx-auto px-4 py-6 space-y-6">
    <div id="shared-timeline" class="space-y-6"></div>

    <section aria-label="Link importieren" class="bg-surface border border-line/80 rounded-2xl p-4 space-y-2.5">
      <label for="import-link-input" class="block text-xs font-medium text-muted">Link oder Code einfügen &amp; übernehmen</label>
      <div class="flex items-center gap-2">
        <input
          id="import-link-input"
          type="text"
          placeholder="https://.../receiver.html#data=... oder PULT1:..."
          class="flex-1 min-w-0 px-3 py-2 text-xs font-mono bg-paper border border-line rounded-xl text-ink outline-none focus:border-ink transition-colors"
        />
        <button
          id="btn-import-link"
          type="button"
          class="shrink-0 px-3.5 py-2 rounded-xl text-xs font-medium bg-ink text-white hover:bg-zinc-800 transition-colors"
        >
          Übernehmen
        </button>
      </div>
    </section>
  </main>

  <div id="toast-box" class="fixed bottom-5 left-4 right-4 max-w-xl mx-auto z-30 pointer-events-none space-y-2"></div>

  <script>
    const RECEIVER_STORAGE_KEY = 'pult_receiver_only_items_v1';
    const USED_LINKS_STORAGE_KEY = 'pult_receiver_used_links_v1';
    let activeFilter = 'all';
    let items = loadItems().filter(it => !(it.kind === 'reminder' && it.completed));
    let usedSignatures = loadUsedSignatures();

    function getTodayISO() {
      const now = new Date();
      if (now.getFullYear() < 2026) return '2026-11-21';
      return toISO(now);
    }

    function toISO(dt) {
      const y = dt.getFullYear();
      const m = String(dt.getMonth() + 1).padStart(2, '0');
      const d = String(dt.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function addDaysISO(iso, days) {
      const [y, m, d] = iso.split('-').map(Number);
      const dt = new Date(y, m - 1, d + days);
      return toISO(dt);
    }

    function formatHeading(iso, todayISO) {
      const [y, m, d] = iso.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const days = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
      const months = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
      const label = `${days[dt.getDay()]}, ${d}. ${months[m - 1]}`;
      if (iso === todayISO) return `${label} · Heute`;
      if (iso === addDaysISO(todayISO, 1)) return `${label} · Morgen`;
      return label;
    }

    function escapeText(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showToast(title, body) {
      const box = document.getElementById('toast-box');
      const el = document.createElement('div');
      el.className = 'pointer-events-auto bg-ink text-white rounded-2xl px-4 py-3 shadow-lg flex items-start justify-between gap-3 text-xs';
      el.innerHTML = `<div><p class="font-semibold">${escapeText(title)}</p><p class="text-zinc-300 mt-0.5">${escapeText(body)}</p></div><button type="button" class="text-zinc-400 hover:text-white">✕</button>`;
      el.querySelector('button').addEventListener('click', () => el.remove());
      box.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    function loadItems() {
      try {
        const raw = localStorage.getItem(RECEIVER_STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (err) {
        return [];
      }
    }

    function saveItems() {
      try {
        localStorage.setItem(RECEIVER_STORAGE_KEY, JSON.stringify(items));
      } catch (err) {}
    }

    function loadUsedSignatures() {
      try {
        const raw = localStorage.getItem(USED_LINKS_STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (err) {
        return [];
      }
    }

    function saveUsedSignatures() {
      try {
        localStorage.setItem(USED_LINKS_STORAGE_KEY, JSON.stringify(usedSignatures.slice(-150)));
      } catch (err) {}
    }

    function getSignature(encodedToken, payload) {
      if (payload && payload.createdAt) {
        return `${payload.createdAt}::${payload.filter || ''}`;
      }
      return String(encodedToken || '').trim();
    }

    function stripHtmlToText(html) {
      const div = document.createElement('div');
      div.innerHTML = html || '';
      return (div.textContent || div.innerText || '').replace(/\s+/g, ' ').trim();
    }

    function applyPacket(packet) {
      if (!packet) return;
      const fallbackDate = getTodayISO();
      const incoming = [];

      if (packet.kind === 'reminders' && Array.isArray(packet.entries)) {
        packet.entries.forEach(ent => {
          if (ent.completed) return;
          incoming.push({
            id: `rcv_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
            kind: 'reminder',
            title: ent.title || 'Erinnerung',
            date: ent.date || fallbackDate,
            time: ent.startTime || '09:00',
            desk: ent.deskName || '',
            completed: false
          });
        });
      } else if (packet.kind === 'events' && Array.isArray(packet.entries)) {
        packet.entries.forEach(ent => {
          incoming.push({
            id: `rcv_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
            kind: 'event',
            title: ent.title || 'Ereignis',
            date: ent.date || fallbackDate,
            time: ent.endTime ? `${ent.startTime}–${ent.endTime}` : (ent.startTime || '09:00'),
            desk: ent.deskName || '',
            completed: false
          });
        });
      } else if (packet.kind === 'desk' && packet.data) {
        if (Array.isArray(packet.entries)) {
          packet.entries.forEach(ent => {
            if (ent.type !== 'event' && ent.completed) return;
            incoming.push({
              id: `rcv_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
              kind: ent.type === 'event' ? 'event' : 'reminder',
              title: ent.title || 'Eintrag',
              date: ent.date || fallbackDate,
              time: ent.type === 'event' ? (ent.endTime ? `${ent.startTime}–${ent.endTime}` : ent.startTime) : (ent.startTime || '09:00'),
              desk: packet.data.name || '',
              completed: false
            });
          });
        }
        const plain = stripHtmlToText(packet.data.content);
        if (plain) {
          incoming.push({
            id: `rcv_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
            kind: 'note',
            title: plain,
            date: fallbackDate,
            time: '',
            desk: packet.data.name || '',
            completed: false
          });
        }
      } else {
        // Unterstützung für strukturierte Pakete mit reminders / events / notes Arrays
        if (Array.isArray(packet.reminders)) {
          packet.reminders.forEach(ent => {
            if (ent.completed) return;
            incoming.push({
              id: `rcv_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
              kind: 'reminder',
              title: ent.title || 'Erinnerung',
              date: ent.date || fallbackDate,
              time: ent.startTime || '09:00',
              desk: ent.deskTitle || ent.deskName || '',
              completed: false
            });
          });
        }
        if (Array.isArray(packet.events)) {
          packet.events.forEach(ent => {
            incoming.push({
              id: `rcv_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
              kind: 'event',
              title: ent.title || 'Ereignis',
              date: ent.date || fallbackDate,
              time: ent.endTime ? `${ent.startTime}–${ent.endTime}` : (ent.startTime || '09:00'),
              desk: ent.deskTitle || ent.deskName || '',
              completed: false
            });
          });
        }
        if (Array.isArray(packet.notes)) {
          packet.notes.forEach(ent => {
            const plain = stripHtmlToText(ent.title || ent.text || '');
            if (!plain) return;
            incoming.push({
              id: `rcv_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
              kind: 'note',
              title: plain,
              date: ent.date || fallbackDate,
              time: '',
              desk: ent.deskTitle || ent.deskName || '',
              completed: false
            });
          });
        }
      }

      if (incoming.length > 0) {
        items = incoming.concat(items);
        saveItems();
        showToast('Empfangen', `${incoming.length} Eintrag/Einträge in der Datumsliste gespeichert.`);
      }
    }

    function extractEncodedPayload(rawValue) {
      const trimmed = String(rawValue || '').trim();
      if (!trimmed) return '';
      const hashIndex = trimmed.indexOf('#data=');
      if (hashIndex !== -1) {
        return trimmed.slice(hashIndex + '#data='.length).trim();
      }
      if (trimmed.startsWith('data=')) {
        return trimmed.slice('data='.length).trim();
      }
      if (trimmed.startsWith('PULT1:')) {
        return trimmed.slice('PULT1:'.length).trim();
      }
      return '';
    }

    function clearUrlHash() {
      if (!window.location.hash) return;
      try {
        history.replaceState(null, '', window.location.pathname + window.location.search);
      } catch (err) {
        window.location.hash = '';
      }
    }

    function readUrlHashData() {
      const hash = window.location.hash || '';
      if (!hash.startsWith('#data=')) return;

      const encoded = extractEncodedPayload(hash);
      clearUrlHash();
      if (!encoded) return;

      try {
        const json = decodeURIComponent(escape(atob(encoded)));
        const payload = JSON.parse(json);
        if (!payload || !payload.packet) return;

        const sig = getSignature(encoded, payload);
        if (usedSignatures.includes(sig)) return;

        usedSignatures.push(sig);
        saveUsedSignatures();
        applyPacket(payload.packet);
      } catch (err) {}
    }

    function restartReceiverWithLink(rawLink) {
      const inputEl = document.getElementById('import-link-input');
      const encoded = extractEncodedPayload(rawLink);

      // Leiste sofort leeren, damit kein doppeltes Einfügen/Spam passiert
      if (inputEl) inputEl.value = '';

      if (!encoded) {
        showToast('Ungültiger Link', 'Bitte einen gültigen pult.-Link (#data=...) oder Code einfügen.');
        return;
      }

      let payload = null;
      try {
        const json = decodeURIComponent(escape(atob(encoded)));
        payload = JSON.parse(json);
      } catch (err) {
        showToast('Link fehlerhaft', 'Die Daten konnten nicht gelesen werden.');
        return;
      }

      if (!payload || !payload.packet) {
        showToast('Link leer', 'Es wurden keine Daten gefunden.');
        return;
      }

      const sig = getSignature(encoded, payload);
      if (usedSignatures.includes(sig)) {
        showToast('Bereits eingelöst', 'Dieser Link wurde bereits einmal verwendet.');
        return;
      }

      usedSignatures.push(sig);
      saveUsedSignatures();
      applyPacket(payload.packet);
      clearUrlHash();

      activeFilter = 'all';
      document.querySelectorAll('.filter-pill').forEach(b => {
        const isAll = b.getAttribute('data-filter') === 'all';
        b.className = isAll
          ? 'filter-pill px-3 py-1 rounded-full text-xs font-medium bg-ink text-white'
          : 'filter-pill px-3 py-1 rounded-full text-xs font-medium bg-surface border border-line text-muted hover:text-ink';
      });

      renderTimeline();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderTypeBadge(kind) {
      if (kind === 'reminder') {
        return '<span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-amber-100 text-amber-900">Erinnerung</span>';
      }
      if (kind === 'event') {
        return '<span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-blue-100 text-blue-900">Ereignis</span>';
      }
      return '<span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-zinc-200/80 text-zinc-700">Notiz</span>';
    }

    function renderTimeline() {
      const container = document.getElementById('shared-timeline');
      const todayISO = getTodayISO();

      const filtered = items.filter(item => {
        if (item.kind === 'reminder' && item.completed) return false;
        if (activeFilter === 'all') return true;
        return item.kind === activeFilter;
      });

      const dates = new Set();
      for (let i = 0; i < 10; i++) dates.add(addDaysISO(todayISO, i));
      filtered.forEach(item => { if (item.date) dates.add(item.date); });
      const sortedDates = Array.from(dates).sort();

      container.innerHTML = '';
      sortedDates.forEach(dateISO => {
        const dayItems = filtered.filter(i => i.date === dateISO);
        const block = document.createElement('section');

        const h2 = document.createElement('h2');
        h2.className = dayItems.length > 0
          ? 'text-xs font-semibold text-ink mb-2.5 tracking-tight'
          : 'text-xs font-normal text-subtle py-1';
        h2.textContent = formatHeading(dateISO, todayISO);
        block.appendChild(h2);

        if (dayItems.length > 0) {
          const list = document.createElement('div');
          list.className = 'space-y-2';

          dayItems.forEach(item => {
            const card = document.createElement('div');
            card.className = 'bg-surface border border-line/80 rounded-xl px-3.5 py-3 flex items-start justify-between gap-3';

            const left = document.createElement('div');
            left.className = 'flex items-start gap-2.5 min-w-0 flex-1';

            if (item.kind === 'reminder') {
              const cb = document.createElement('input');
              cb.type = 'checkbox';
              cb.checked = false;
              cb.className = 'pult-check';
              cb.addEventListener('change', () => {
                if (cb.checked) {
                  items = items.filter(x => x.id !== item.id);
                  saveItems();
                  showToast('Erledigt', 'To-do aus dem Receiver entfernt.');
                  renderTimeline();
                }
              });
              left.appendChild(cb);
            }

            const textWrap = document.createElement('div');
            textWrap.className = 'min-w-0 flex-1';

            const metaRow = document.createElement('div');
            metaRow.className = 'flex flex-wrap items-center gap-1.5 mb-1';
            metaRow.innerHTML = renderTypeBadge(item.kind) +
              (item.time ? `<span class="font-mono text-xs text-muted">${escapeText(item.time)}</span>` : '') +
              (item.desk ? `<span class="text-[11px] text-subtle">· ${escapeText(item.desk)}</span>` : '');

            const titleEl = document.createElement('p');
            titleEl.className = 'text-sm leading-snug break-words text-ink';
            titleEl.textContent = item.title;

            textWrap.appendChild(metaRow);
            textWrap.appendChild(titleEl);
            left.appendChild(textWrap);

            card.appendChild(left);
            list.appendChild(card);
          });

          block.appendChild(list);
        }

        container.appendChild(block);
      });
    }

    document.getElementById('btn-restart-receiver').addEventListener('click', () => {
      const inputEl = document.getElementById('import-link-input');
      if (inputEl) inputEl.value = '';
      clearUrlHash();
      items = loadItems().filter(it => !(it.kind === 'reminder' && it.completed));
      saveItems();
      renderTimeline();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      showToast('Aktualisiert', 'Receiver wurde neu geladen.');
    });

    document.querySelectorAll('.filter-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        activeFilter = btn.getAttribute('data-filter');
        document.querySelectorAll('.filter-pill').forEach(b => {
          const isCurrent = b === btn;
          b.className = isCurrent
            ? 'filter-pill px-3 py-1 rounded-full text-xs font-medium bg-ink text-white'
            : 'filter-pill px-3 py-1 rounded-full text-xs font-medium bg-surface border border-line text-muted hover:text-ink';
        });
        renderTimeline();
      });
    });

    document.getElementById('btn-enable-notify').addEventListener('click', async () => {
      if (!('Notification' in window)) return;
      const perm = await Notification.requestPermission();
      showToast('Mitteilungen', perm === 'granted' ? 'Aktiviert.' : 'Nicht erlaubt.');
    });

    document.getElementById('btn-import-link').addEventListener('click', () => {
      const inputEl = document.getElementById('import-link-input');
      restartReceiverWithLink(inputEl ? inputEl.value : '');
    });

    document.getElementById('import-link-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        restartReceiverWithLink(e.target.value);
      }
    });

    readUrlHashData();
    renderTimeline();
  </script>
</body>
</html>
