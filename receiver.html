<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="pult. iPhone" />
  <meta name="theme-color" content="#FBFBF9" />
  <title>pult. · Geteiltes (iPhone)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          },
          colors: {
            paper: '#FBFBF9',
            surface: '#FFFFFF',
            ink: '#18181B',
            muted: '#71717A',
            subtle: '#A1A1AA',
            line: '#E4E4E7',
          }
        }
      }
    };
  </script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #FBFBF9;
      color: #18181B;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .pult-check {
      appearance: none;
      -webkit-appearance: none;
      width: 1.05rem;
      height: 1.05rem;
      min-width: 1.05rem;
      margin-top: 0.15rem;
      border: 1.5px solid #A1A1AA;
      border-radius: 5px;
      background-color: #FFFFFF;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .pult-check:checked {
      background-color: #18181B;
      border-color: #18181B;
    }
    .pult-check:checked::after {
      content: "";
      width: 0.32rem;
      height: 0.55rem;
      border: solid #FFFFFF;
      border-width: 0 1.75px 1.75px 0;
      transform: rotate(45deg);
      margin-bottom: 1px;
    }
  </style>
</head>
<body class="min-h-screen bg-paper text-ink">
  <header class="sticky top-0 z-20 bg-paper/90 backdrop-blur-md border-b border-line">
    <div class="max-w-xl mx-auto px-4 py-3.5 flex items-center justify-between gap-3">
      <div>
        <div class="flex items-center gap-2">
          <span class="font-semibold tracking-tight text-lg text-ink">pult.</span>
          <span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-zinc-200/70 text-muted">iPhone · Geteiltes</span>
        </div>
        <p id="pair-status-label" class="text-[11px] text-muted mt-0.5">Ein Schreibtisch für alles vom Mac</p>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="btn-enable-notify" type="button" class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-zinc-100 hover:bg-zinc-200 text-ink transition-colors">
          Mitteilungen
        </button>
        <button id="btn-demo-item" type="button" title="Beispiel-Sendung hinzufügen" class="px-2.5 py-1.5 rounded-lg text-xs font-medium border border-line bg-surface hover:bg-zinc-50 text-muted hover:text-ink transition-colors">
          + Test
        </button>
      </div>
    </div>
    <div class="max-w-xl mx-auto px-4 pb-2.5 flex items-center gap-1.5 overflow-x-auto">
      <button type="button" data-filter="all" class="filter-pill px-3 py-1 rounded-full text-xs font-medium bg-ink text-white">Alle</button>
      <button type="button" data-filter="reminder" class="filter-pill px-3 py-1 rounded-full text-xs font-medium bg-surface border border-line text-muted hover:text-ink">Erinnerungen</button>
      <button type="button" data-filter="event" class="filter-pill px-3 py-1 rounded-full text-xs font-medium bg-surface border border-line text-muted hover:text-ink">Kalender</button>
      <button type="button" data-filter="note" class="filter-pill px-3 py-1 rounded-full text-xs font-medium bg-surface border border-line text-muted hover:text-ink">Notizen</button>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 py-6">
    <div id="shared-timeline" class="space-y-6"></div>
  </main>

  <div id="toast-box" class="fixed bottom-5 left-4 right-4 max-w-xl mx-auto z-30 pointer-events-none space-y-2"></div>

  <script>
    const SHARED_STORAGE_KEY = 'pult_iphone_shared_v1';
    const BRIDGE_TRANSFER_KEY = 'pult_bridge_last_packet';
    const broadcastChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('pult_mac_iphone_channel') : null;

    let activeFilter = 'all';
    let sharedState = loadSharedState();

    function getTodayISO() {
      const now = new Date();
      if (now.getFullYear() < 2026) return '2026-11-21';
      return toISO(now);
    }

    function toISO(dt) {
      const y = dt.getFullYear();
      const m = String(dt.getMonth() + 1).padStart(2, '0');
      const d = String(dt.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function addDaysISO(iso, days) {
      const [y, m, d] = iso.split('-').map(Number);
      const dt = new Date(y, m - 1, d + days);
      return toISO(dt);
    }

    function formatHeading(iso, todayISO) {
      const [y, m, d] = iso.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const days = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
      const months = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
      const label = `${days[dt.getDay()]}, ${d}. ${months[m - 1]}`;
      if (iso === todayISO) return `${label} · Heute`;
      if (iso === addDaysISO(todayISO, 1)) return `${label} · Morgen`;
      return label;
    }

    function escapeText(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showToast(title, body) {
      const box = document.getElementById('toast-box');
      const el = document.createElement('div');
      el.className = 'pointer-events-auto bg-ink text-white rounded-2xl px-4 py-3 shadow-lg flex items-start justify-between gap-3 text-xs';
      el.innerHTML = `<div><p class="font-semibold">${escapeText(title)}</p><p class="text-zinc-300 mt-0.5">${escapeText(body)}</p></div><button type="button" class="text-zinc-400 hover:text-white">✕</button>`;
      el.querySelector('button').addEventListener('click', () => el.remove());
      box.appendChild(el);
      setTimeout(() => el.remove(), 5000);
    }

    function notifyUser(title, body) {
      showToast(title, body);
      if ('Notification' in window && Notification.permission === 'granted') {
        try { new Notification(`pult. · ${title}`, { body }); } catch (e) {}
      }
    }

    function createDefaultSharedState() {
      return {
        pairedMac: null,
        items: [
          {
            id: 'sh_1',
            kind: 'reminder',
            title: 'Zahnarzt anrufen',
            date: '2026-11-23',
            time: '09:00',
            desk: 'Privat',
            completed: false
          },
          {
            id: 'sh_2',
            kind: 'event',
            title: 'Besprechung',
            date: '2026-11-23',
            time: '14:00–15:30',
            desk: 'Projekte',
            completed: false
          },
          {
            id: 'sh_3',
            kind: 'note',
            title: 'Packliste & Unterlagen für unterwegs vom Mac geteilt',
            date: '2026-11-24',
            time: '',
            desk: 'Privat',
            completed: false
          }
        ]
      };
    }

    function loadSharedState() {
      try {
        const raw = localStorage.getItem(SHARED_STORAGE_KEY);
        if (!raw) return createDefaultSharedState();
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed.items)) return createDefaultSharedState();
        return parsed;
      } catch (e) {
        return createDefaultSharedState();
      }
    }

    function saveSharedState() {
      try {
        localStorage.setItem(SHARED_STORAGE_KEY, JSON.stringify(sharedState));
      } catch (e) {}
    }

    function stripHtmlToText(html) {
      const div = document.createElement('div');
      div.innerHTML = html || '';
      return (div.textContent || div.innerText || '').replace(/\s+/g, ' ').trim();
    }

    function ingestPacket(packet, fromMac) {
      if (!packet) return;
      if (fromMac) sharedState.pairedMac = fromMac;
      const fallbackDate = getTodayISO();

      if (packet.kind === 'entry' && packet.data) {
        const d = packet.data;
        sharedState.items.unshift({
          id: `sh_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          kind: d.type === 'event' ? 'event' : 'reminder',
          title: d.title || 'Eintrag',
          date: d.date || fallbackDate,
          time: d.type === 'event' ? (d.endTime ? `${d.startTime}–${d.endTime}` : d.startTime) : (d.startTime || '09:00'),
          desk: packet.deskName || 'Privat',
          completed: !!d.completed
        });
        notifyUser(d.type === 'event' ? 'Kalender geteilt' : 'Erinnerung geteilt', d.title || 'Neuer Eintrag');
      } else if (packet.kind === 'snippet' && packet.text) {
        sharedState.items.unshift({
          id: `sh_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          kind: 'note',
          title: packet.text,
          date: fallbackDate,
          time: '',
          desk: 'Mac',
          completed: false
        });
        notifyUser('Notiz geteilt', packet.text);
      } else if (packet.kind === 'desk' && packet.data) {
        if (Array.isArray(packet.entries) && packet.entries.length > 0) {
          packet.entries.forEach(ent => {
            sharedState.items.unshift({
              id: `sh_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
              kind: ent.type === 'event' ? 'event' : 'reminder',
              title: ent.title || 'Eintrag',
              date: ent.date || fallbackDate,
              time: ent.type === 'event' ? (ent.endTime ? `${ent.startTime}–${ent.endTime}` : ent.startTime) : (ent.startTime || '09:00'),
              desk: packet.data.name || 'Schreibtisch',
              completed: !!ent.completed
            });
          });
        }
        const plain = stripHtmlToText(packet.data.content);
        if (plain) {
          sharedState.items.unshift({
            id: `sh_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
            kind: 'note',
            title: plain.slice(0, 220),
            date: fallbackDate,
            time: '',
            desk: packet.data.name || 'Schreibtisch',
            completed: false
          });
        }
        notifyUser('Schreibtisch geteilt', packet.data.name || 'Schreibtisch');
      } else if (packet.kind === 'bundle' && Array.isArray(packet.entries)) {
        packet.entries.forEach(ent => {
          sharedState.items.unshift({
            id: `sh_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
            kind: ent.type === 'event' ? 'event' : 'reminder',
            title: ent.title || 'Eintrag',
            date: ent.date || fallbackDate,
            time: ent.type === 'event' ? (ent.endTime ? `${ent.startTime}–${ent.endTime}` : ent.startTime) : (ent.startTime || '09:00'),
            desk: 'Mac',
            completed: !!ent.completed
          });
        });
        notifyUser('Einträge geteilt', `${packet.entries.length} Einträge übernommen`);
      }

      saveSharedState();
      renderTimeline();
    }

    function consumeIncomingUrl() {
      const params = new URLSearchParams(window.location.search);
      const pair = params.get('pair');
      if (pair) sharedState.pairedMac = pair;

      const hash = window.location.hash || '';
      if (hash.startsWith('#receive=')) {
        try {
          const encoded = hash.slice('#receive='.length);
          const json = decodeURIComponent(escape(atob(encoded)));
          const payload = JSON.parse(json);
          if (payload && payload.packet) {
            ingestPacket(payload.packet, payload.fromMac);
          }
        } catch (e) {}
      }
      saveSharedState();
    }

    function renderBadge(kind) {
      if (kind === 'reminder') {
        return '<span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-amber-100 text-amber-900">Erinnerung</span>';
      }
      if (kind === 'event') {
        return '<span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-blue-100 text-blue-900">Kalender</span>';
      }
      return '<span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-zinc-200/80 text-zinc-700">Notiz</span>';
    }

    function renderTimeline() {
      const container = document.getElementById('shared-timeline');
      const todayISO = getTodayISO();

      const filtered = sharedState.items.filter(item => {
        if (activeFilter === 'all') return true;
        return item.kind === activeFilter;
      });

      const dates = new Set();
      for (let i = 0; i < 10; i++) dates.add(addDaysISO(todayISO, i));
      filtered.forEach(item => { if (item.date) dates.add(item.date); });
      const sortedDates = Array.from(dates).sort();

      container.innerHTML = '';
      sortedDates.forEach(dateISO => {
        const dayItems = filtered.filter(i => i.date === dateISO);
        const block = document.createElement('section');

        const h2 = document.createElement('h2');
        h2.className = dayItems.length > 0
          ? 'text-xs font-semibold text-ink mb-2.5 tracking-tight'
          : 'text-xs font-normal text-subtle py-1';
        h2.textContent = formatHeading(dateISO, todayISO);
        block.appendChild(h2);

        if (dayItems.length > 0) {
          const list = document.createElement('div');
          list.className = 'space-y-2';

          dayItems.forEach(item => {
            const card = document.createElement('div');
            card.className = 'bg-surface border border-line/80 rounded-xl px-3.5 py-3 flex items-start justify-between gap-3';

            const left = document.createElement('div');
            left.className = 'flex items-start gap-2.5 min-w-0 flex-1';

            if (item.kind === 'reminder') {
              const cb = document.createElement('input');
              cb.type = 'checkbox';
              cb.checked = !!item.completed;
              cb.className = 'pult-check';
              cb.addEventListener('change', () => {
                item.completed = cb.checked;
                saveSharedState();
                renderTimeline();
              });
              left.appendChild(cb);
            }

            const textWrap = document.createElement('div');
            textWrap.className = 'min-w-0 flex-1';

            const metaRow = document.createElement('div');
            metaRow.className = 'flex flex-wrap items-center gap-1.5 mb-1';
            metaRow.innerHTML = renderBadge(item.kind) +
              (item.time ? `<span class="font-mono text-xs text-muted">${escapeText(item.time)}</span>` : '') +
              (item.desk ? `<span class="text-[11px] text-subtle">· ${escapeText(item.desk)}</span>` : '');

            const titleEl = document.createElement('p');
            titleEl.className = `text-sm leading-snug break-words ${item.completed ? 'line-through text-subtle' : 'text-ink'}`;
            titleEl.textContent = item.title;

            textWrap.appendChild(metaRow);
            textWrap.appendChild(titleEl);
            left.appendChild(textWrap);

            card.appendChild(left);
            list.appendChild(card);
          });

          block.appendChild(list);
        }

        container.appendChild(block);
      });

      const pairEl = document.getElementById('pair-status-label');
      if (pairEl) {
        const code = (sharedState.pairedMac || '').slice(-4).toUpperCase() || 'BEREIT';
        pairEl.textContent = `Ein Schreibtisch für alles vom Mac · Mac-Code: ${code}`;
      }
    }

    document.querySelectorAll('.filter-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        activeFilter = btn.getAttribute('data-filter');
        document.querySelectorAll('.filter-pill').forEach(b => {
          const isCurrent = b === btn;
          b.className = isCurrent
            ? 'filter-pill px-3 py-1 rounded-full text-xs font-medium bg-ink text-white'
            : 'filter-pill px-3 py-1 rounded-full text-xs font-medium bg-surface border border-line text-muted hover:text-ink';
        });
        renderTimeline();
      });
    });

    document.getElementById('btn-enable-notify').addEventListener('click', async () => {
      if (!('Notification' in window)) return;
      const perm = await Notification.requestPermission();
      showToast('Mitteilungen', perm === 'granted' ? 'Mitteilungen sind aktiviert.' : 'Nicht erlaubt.');
    });

    document.getElementById('btn-demo-item').addEventListener('click', () => {
      ingestPacket({
        kind: 'entry',
        deskName: 'Privat',
        data: {
          type: 'reminder',
          title: 'Paket von der Abholstation holen',
          date: addDaysISO(getTodayISO(), 1),
          startTime: '11:00',
          completed: false
        }
      }, sharedState.pairedMac);
    });

    if (broadcastChannel) {
      broadcastChannel.onmessage = (event) => {
        if (event.data && event.data.packet) {
          ingestPacket(event.data.packet, event.data.fromMac);
        }
      };
    }

    window.addEventListener('storage', (e) => {
      if (e.key === BRIDGE_TRANSFER_KEY && e.newValue) {
        try {
          const tr = JSON.parse(e.newValue);
          if (tr && tr.packet) ingestPacket(tr.packet, tr.fromMac);
        } catch (err) {}
      }
    });

    consumeIncomingUrl();
    renderTimeline();
  </script>
</body>
</html>
